min_version: 2.1.14

pre-commit:
  jobs:
    - name: fmt
      run: cargo fmt --check
    - name: clippy
      run: cargo clippy --all-targets -- -D warnings

pre-push:
  jobs:
    - name: guard-origin
      run: bash scripts/hooks/guard-origin-push.sh {1}
      use_stdin: true
    - name: test
      run: cargo test
